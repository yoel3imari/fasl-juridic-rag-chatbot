# Dev-first base stack: fastapi :8000, nextjs :3000, qdrant :6333,
# crispembed :8080. No PostgreSQL, Redis, Ollama, or auth — plan scope.
# base=dev (dev targets, bind mounts, reload commands, develop.watch,
# restart "no" for app services). prod via `-f docker-compose.prod.yml`
# which !overrides volumes/commands on top of this base.
name: fasl

services:
  qdrant:
    build:
      context: ./qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  crispembed:
    build:
      context: ./crispembed
    ports:
      - "8080:8080"
    volumes:
      # Persist the 449MB bge-m3 GGUF across recreations (server cache dir).
      # Path must match the runtime user's HOME (/home/crispembed), not /root.
      - crispembed_models:/home/crispembed/.cache/crispembed
      - crispembed_models:/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  # TEMPORARY quality-gate service (plan todo 6): same upgraded image, bge-m3
  # on 8081. Never run at the same time as `crispembed` (one GGUF in RAM;
  # ~2GB free host RAM). Removed in todo 19; the cached GGUF stays in the
  # shared crispembed_models volume.
  crispembed-bge:
    build:
      context: ./crispembed
    command: ["./crispembed-server", "-m", "bge-m3", "--port", "8081",
      "--host", "0.0.0.0", "--image-root", "/models", "--model-root", "/models"]
    ports:
      - "8081:8081"
    volumes:
      - crispembed_models:/home/crispembed/.cache/crispembed
      - crispembed_models:/models
    environment:
      CRISPEMBED_ENCODER_PACKED: "1"
      CRISPEMBED_CRISPEMBED_BENCH: "1"
      XDG_CACHE_HOME: /models/cache
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: "no"

  fastapi:
    # Own image name (prod uses another): a shared name lets `up` reuse the
    # wrong Dockerfile's image.
    image: fasl-fastapi-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      CRISPEMBED_URL: http://crispembed:8080
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - backend_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      crispembed:
        condition: service_healthy
    restart: "no"
    develop:
      watch:
        - path: ./backend/app
          target: /app/app
          action: sync+restart
        - path: ./backend/alembic
          target: /app/alembic
          action: sync+restart

  nextjs:
    # Own image name (prod uses another): a shared name lets `up` reuse the
    # wrong Dockerfile's image.
    image: fasl-nextjs-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["bun", "run", "dev"]
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      fastapi:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync

volumes:
  qdrant_data:
  crispembed_models:
  backend_data:
