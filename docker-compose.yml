# Dev-first base stack: fastapi :8000, nextjs :3000, qdrant :6333,
# crispembed :8080. No PostgreSQL, Redis, Ollama, or auth — plan scope.
# base=dev (dev targets, bind mounts, reload commands, develop.watch,
# restart "no" for app services). prod via `-f docker-compose.prod.yml`
# which !overrides volumes/commands on top of this base.
name: fasl

services:
  qdrant:
    build:
      context: ./qdrant
    ports:
      # REST + Web UI dashboard at http://localhost:6333/dashboard
      - "6333:6333"
    environment:
      # Web UI is on by default; pin it so a custom image/config can't silently disable it.
      QDRANT__SERVICE__ENABLE_STATIC_CONTENT: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  crispembed:
    build:
      context: ./crispembed
    # Explicit -m so the served model provably matches the tokenizer that
    # app/domain/authority/granite_tokens.py measures the budget with
    # (ibm-granite/granite-embedding-107m-multilingual). bge-m3 measured
    # better recall@10 (0.9750 vs 0.9167) but costs ~15h to embed the corpus
    # on 4 cores vs ~1h, so granite is the serving embedder.
    command:
      - "./crispembed-server"
      - "-m"
      - "granite-embedding-107m-multilingual"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--image-root"
      - "/models"
      - "--model-root"
      - "/models"
    ports:
      - "8080:8080"
    volumes:
      # Persist the served GGUF across recreations (server cache dir).
      # Path must match the runtime user's HOME (/home/crispembed), not /root.
      - crispembed_models:/home/crispembed/.cache/crispembed
      - crispembed_models:/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  fastapi:
    # Own image name (prod uses another): a shared name lets `up` reuse the
    # wrong Dockerfile's image.
    image: fasl-fastapi-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Host network so the app-stored base_url http://127.0.0.1:11434 reaches
    # the host LLM directly: on a bridge the container's localhost would be
    # itself, and bridge-to-host IPs are filtered by the host firewall.
    # Infra URLs therefore use host-localhost (their ports are published).
    network_mode: host
    command: ["sh", "-c", "uv run alembic upgrade head && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    env_file:
      - .env
    environment:
      QDRANT_URL: http://localhost:6333
      CRISPEMBED_URL: http://localhost:8080
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      crispembed:
        condition: service_healthy
    restart: "no"
    develop:
      watch:
        - path: ./backend/app
          target: /app/app
          action: sync+restart
        - path: ./backend/alembic
          target: /app/alembic
          action: sync+restart

  nextjs:
    # Own image name (prod uses another): a shared name lets `up` reuse the
    # wrong Dockerfile's image.
    image: fasl-nextjs-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["bun", "run", "dev"]
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      fastapi:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: "no"
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync

volumes:
  qdrant_data:
  crispembed_models:
