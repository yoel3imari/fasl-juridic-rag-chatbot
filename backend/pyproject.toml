[project]
name = "moroccan-legal-rag-backend"
version = "0.1.0"
description = "Moroccan Legal RAG - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "pydantic-ai>=0.1",
    "respx>=0.23.1",
    "flashrank>=0.2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "qdrant-client>=1.12",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
]
# Dev/CI-only pinned reference stack for the CLS-pooling parity harness
# (plan todo 5: scripts/embedding_reference.py). CPU-only: install torch from
# the PyTorch CPU index, e.g.
#   uv pip install --index-url https://download.pytorch.org/whl/cpu \
#       -e ".[embedding-reference]"
# Never a runtime dependency; never installed in the prod image.
embedding-reference = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "huggingface-hub==0.34.6",
    "safetensors==0.8.0",
    "numpy==2.5.3; python_version >= '3.12'",
    "numpy==2.2.6; python_version < '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
