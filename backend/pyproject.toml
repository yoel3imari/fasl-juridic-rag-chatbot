[project]
name = "moroccan-legal-rag-backend"
version = "0.1.0"
description = "Moroccan Legal RAG - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "zstandard>=0.23",
    "pydantic-ai>=0.1",
    "respx>=0.23.1",
    "flashrank>=0.2.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "qdrant-client>=1.12",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
]
# Dev/CI-only pinned reference stack for the CLS-pooling parity harness
# (plan todo 5: scripts/embedding_reference.py). CPU-only: install torch from
# the PyTorch CPU index, e.g.
#   uv pip install --index-url https://download.pytorch.org/whl/cpu \
#       -e ".[embedding-reference]"
# Never a runtime dependency; never installed in the prod image.
embedding-reference = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "huggingface-hub==0.34.6",
    "safetensors==0.8.0",
    "numpy==2.5.3; python_version >= '3.12'",
    "numpy==2.2.6; python_version < '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Todo 02: ban framework/ORM imports from the pure layers. `banned-api` is
# project-wide in ruff, so the scoping to app/domain/** and app/services/** is
# done by un-banning every other layer via per-file-ignores below (TID251).
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "domain must not import fastapi"
"sqlalchemy".msg = "domain must not import sqlalchemy"

# Baseline: 141 pre-existing violations across 43 files, recorded at plan todo 1.
# Pinned per file+code so newly introduced violations are still reported.
# NOTE: paths must be updated in the same commit as each `git mv` (see plan F7).
[tool.ruff.lint.per-file-ignores]
# TID251 un-ban allow-list: `banned-api` fires project-wide, so every layer
# EXCEPT app/domain/** and app/services/** re-enables it here. A file placed
# under domain/ or services/ is enforced automatically on arrival. NOTE: ruff globs
# let `*` cross `/`, so root modules are listed as exact paths, never app/*.py.
"app/analysis/**" = ["TID251"]
"app/api/**" = ["TID251"]
"app/cli/**" = ["TID251"]
"app/config/**" = ["TID251"]
"app/infrastructure/**" = ["TID251"]
"app/ingestion/**" = ["TID251"]
"app/library/**" = ["TID251"]
"app/llm/**" = ["TID251"]
"app/models/**" = ["TID251"]
"app/rag/**" = ["TID251"]
"app/repositories/**" = ["TID251"]
"app/schemas/**" = ["TID251"]
"app/search/**" = ["TID251"]
"alembic/**" = ["TID251"]
"data/**" = ["TID251"]
"scripts/**" = ["TID251"]
"tests/**" = ["TID251"]
