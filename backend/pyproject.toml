# import-linter (todo 3). The `layers` order encodes the plan's layer rules as a
# total order; `cli` sits directly under `api` because it may import everything
# except `api`. `domain` is the bottom layer. The optional-layer parentheses
# were dropped once todo 39 created the `app.cli` package (until then a
# not-yet-created layer had to be skipped instead of raising).
# `include_external_packages` is required for the forbidden contract to see
# the `fastapi`/`sqlalchemy` nodes.
[tool.importlinter]
root_package = "app"
include_external_packages = true
unmatched_ignore_imports_alerting = false

[[tool.importlinter.contracts]]
name = "Layer cake"
type = "layers"
layers = [
    "app.api",
    "app.cli",
    "app.services",
    "app.infrastructure",
    "app.repositories",
    "app.models",
    "app.domain",
]
ignore_imports = [
    # Deferred ledger write (todo 39): the embedding client marks chunks
    # "embedded" in the CLI ledger during bulk runs through a function-local
    # import of app.cli.library.bulk_state.set_chunk_status. Infrastructure
    # sits below cli in the layer order, so this upward edge is contracted
    # out here rather than restructuring the CLI relocation.
    "app.infrastructure.embeddings.client -> app.cli.library.bulk_state",
]

[[tool.importlinter.contracts]]
name = "Domain purity"
type = "forbidden"
source_modules = ["app.domain.**"]
# The layer rule is "domain may import only domain and stdlib". `fastapi` and
# `sqlalchemy` are the framework/ORM pair; the rest are the third-party model,
# store, document and AI-SDK clients that waves 2-7 push behind
# `infrastructure/`. Without these the contract is decorative: todo 10's own QA
# (importing `flashrank` into app/domain/rerank.py) went uncaught.
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "pydantic_ai",
    "qdrant_client",
    "httpx",
    "flashrank",
    "pytesseract",
    "fitz",
    "docx",
    "zstandard",
    "PIL",
    "aiofile",
    "openai",
    "anthropic",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["app"]
reportMissingImports = "error"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
